# Local tool tests for the shared tools (suite/tool_tests.py; no cloud).
# Domain tool cases go in their own files (evals/tool_tests/<domain>.yaml).
# Verbatim handoff lines are copied from lib/fakes.py SPOKEN_LINES.
tests:
- id: tt_lookup_known_account_last4_only
  tool: lookup_account
  requirements:
  - REQ-8
  - REQ-9
  args:
    phone_or_account: 202 555 0186
  expected_status: ok
  expected_fields:
    identification_status: Pass
    phone_last4: 0186
    business_flag: false
    service_status: active
  expected_state:
    account_id: A1001
    identification_status: Pass
  forbidden_substrings:
  - '2025550186'
  priority: P0
- id: tt_lookup_plausible_unknown_number_is_synthetic
  tool: lookup_account
  requirements:
  - REQ-8
  args:
    phone_or_account: (303) 555-0188
  expected_status: ok
  expected_fields:
    identification_status: Pass
    phone_last4: 0188
  priority: P0
- id: tt_lookup_implausible_number_not_found
  tool: lookup_account
  requirements:
  - REQ-8
  args:
    phone_or_account: 123 456 7890
  expected_status: error
  expected_error: NOT_FOUND
  priority: P0
- id: tt_lookup_blocked_caller
  tool: lookup_account
  requirements:
  - REQ-2
  args:
    phone_or_account: 900-555-0199
  expected_status: error
  expected_error: PERMISSION_DENIED
  expected_state:
    is_blocked: true
  priority: P0
- id: tt_lookup_business_flag_from_fixture
  tool: lookup_account
  requirements:
  - REQ-12
  args:
    phone_or_account: 202 555 0186
  initial_state:
    fx_business_account: 'true'
  expected_status: ok
  expected_fields:
    business_flag: true
  expected_agent_action: 'Business account: hand over with reason business_handoff.'
  expected_state:
    business_flag: true
  priority: P0
- id: tt_lookup_suspended_from_fixture
  tool: lookup_account
  requirements:
  - REQ-27
  args:
    phone_or_account: 202 555 0186
  initial_state:
    fx_service_status: suspended_nonpayment
  expected_status: ok
  expected_fields:
    service_status: suspended_nonpayment
  priority: P0
- id: tt_lookup_third_validation_error_is_too_many_errors
  tool: lookup_account
  requirements:
  - REQ-10
  args:
    phone_or_account: ''
  initial_state:
    global_err_count: 2
  expected_status: error
  expected_error: TOO_MANY_ERRORS
  expected_state:
    global_err_count: 3
  priority: P0
- id: tt_lookup_mock_error_is_system_unavailable
  tool: lookup_account
  requirements:
  - REQ-10
  args:
    phone_or_account: 202 555 0186
  initial_state:
    mock_error: SYSTEM_DOWN
  expected_status: error
  expected_error: SYSTEM_UNAVAILABLE
  expected_agent_action: Hand over with reason system_unavailable.
  priority: P0
- id: tt_send_login_code_sms_masks_destination
  tool: send_login_code
  requirements:
  - REQ-19
  - REQ-9
  args:
    channel: sms
  initial_state:
    account_id: A1001
    phone_last4: 0186
    identification_status: Pass
    auth_status: none
  expected_status: ok
  expected_fields:
    sent: true
    channel: sms
    purpose: login
    destination_last4: 0186
  expected_state:
    auth_status: code_sent
  forbidden_substrings:
  - '271846'
  - '482913'
  priority: P0
- id: tt_send_login_code_email_step_up
  tool: send_login_code
  requirements:
  - REQ-25
  args:
    channel: email
  initial_state:
    account_id: A1001
    phone_last4: 0186
    identification_status: Pass
    auth_status: pass
    logged_in: true
  expected_status: ok
  expected_fields:
    sent: true
    channel: email
    purpose: step_up
  expected_state:
    auth_status: pass
    code_purpose: step_up
  priority: P0
- id: tt_login_ladder_first_try_any_code
  tool: check_login_code
  requirements:
  - REQ-19
  args:
    code: '314159'
  initial_state:
    account_id: A1001
    phone_last4: 0186
    identification_status: Pass
    auth_status: code_sent
  expected_status: ok
  expected_fields:
    verified: true
    logged_in: true
  expected_state:
    auth_status: pass
    logged_in: true
  priority: P0
- id: tt_login_ladder_second_try_unknown_code_fails
  tool: check_login_code
  requirements:
  - REQ-19
  args:
    code: '314159'
  initial_state:
    account_id: A1001
    phone_last4: 0186
    identification_status: Pass
    auth_status: code_sent
    auth_failure_count: 1
  expected_status: error
  expected_error: WRONG_CODE
  expected_state:
    auth_failure_count: 2
  priority: P0
- id: tt_login_ladder_third_try_locks
  tool: check_login_code
  requirements:
  - REQ-19
  args:
    code: '271846'
  initial_state:
    account_id: A1001
    phone_last4: 0186
    identification_status: Pass
    auth_status: code_sent
    auth_failure_count: 2
  expected_status: error
  expected_error: TOO_MANY_ATTEMPTS
  expected_agent_action: Hand over with reason auth_failure_handoff.
  expected_state:
    auth_status: locked
  priority: P0
- id: tt_weak_code_always_fails
  tool: check_login_code
  requirements:
  - REQ-19
  args:
    code: '111111'
  initial_state:
    account_id: A1001
    phone_last4: 0186
    identification_status: Pass
    auth_status: code_sent
  expected_status: error
  expected_error: WRONG_CODE
  priority: P0
- id: tt_otp_on_file_rejects_other_codes
