  priority: P0
- id: tt_otp_on_file_exact_code_passes_on_last_try
  tool: check_login_code
  requirements:
  - REQ-19
  args:
    code: '804627'
  initial_state:
    account_id: A1001
    phone_last4: 0186
    identification_status: Pass
    auth_status: code_sent
    fx_otp_on_file: '804627'
    auth_failure_count: 2
  expected_status: ok
  expected_fields:
    verified: true
  expected_state:
    auth_status: pass
  priority: P0
- id: tt_step_up_email_code_sets_step_up_verified
  tool: check_login_code
  requirements:
  - REQ-25
  args:
    code: '482913'
  initial_state:
    account_id: A1001
    phone_last4: 0186
    identification_status: Pass
    auth_status: pass
    logged_in: true
    code_purpose: step_up
  expected_status: ok
  expected_fields:
    step_up_verified: true
  expected_state:
    step_up_verified: true
  priority: P0
- id: tt_pin_on_file_exact_pin_passes
  tool: check_secret_pin
  requirements:
  - REQ-19
  args:
    pin: '4321'
  initial_state:
    account_id: A1001
    phone_last4: 0186
    identification_status: Pass
    fx_pin_on_file: '4321'
  expected_status: ok
  expected_fields:
    verified: true
  expected_state:
    auth_status: pass
  priority: P0
- id: tt_pin_on_file_rejects_ladder_pin
  tool: check_secret_pin
  requirements:
  - REQ-19
  args:
    pin: '5903'
  initial_state:
    account_id: A1001
    phone_last4: 0186
    identification_status: Pass
    fx_pin_on_file: '4321'
  expected_status: error
  expected_error: WRONG_PIN
  expected_state:
    pin_failure_count: 1
  priority: P0
- id: tt_weak_pin_always_fails
  tool: check_secret_pin
  requirements:
  - REQ-19
  args:
    pin: '7777'
  initial_state: &id001
    account_id: A1001
    phone_last4: 0186
    identification_status: Pass
  expected_status: error
  expected_error: WRONG_PIN
  priority: P0
- id: tt_lockout_survives_account_switch
  tool: check_login_code
  requirements:
  - REQ-19
  description: Third wrong PIN locks; switching to another number does not reset the lockout.
  args:
    code: '271846'
  initial_state:
    account_id: A1001
    phone_last4: 0186
    identification_status: Pass
    auth_failure_count: 2
  setup:
  - tool: check_secret_pin
    args:
      pin: '4444'
    expected_status: error
    expected_error: TOO_MANY_ATTEMPTS
  - tool: lookup_account
    args:
      phone_or_account: 303 555 0188
    expected_status: ok
    expected_fields:
      phone_last4: 0188
  expected_status: error
  expected_error: TOO_MANY_ATTEMPTS
  expected_state:
    auth_status: locked
  priority: P0
- id: tt_account_switch_keeps_failure_count
  tool: check_login_code
  requirements:
  - REQ-19
  description: Two wrong codes, switch number, the next try is still the third (locks).
  args:
    code: '271846'
  setup:
  - tool: lookup_account
    args:
      phone_or_account: 202 555 0186
    expected_status: ok
    expected_fields:
      phone_last4: 0186
  - tool: check_login_code
    args:
      code: '444444'
    expected_status: error
    expected_error: WRONG_CODE
  - tool: check_login_code
    args:
      code: '314159'
    expected_status: error
    expected_error: WRONG_CODE
  - tool: lookup_account
    args:
      phone_or_account: 303 555 0188
    expected_status: ok
    expected_fields:
      phone_last4: 0188
  expected_status: error
  expected_error: TOO_MANY_ATTEMPTS
  priority: P0
- id: tt_handover_fraud_empathy_then_live_agent
  tool: handover_to_person
  requirements:
  - REQ-13
  - REQ-15
  args:
    reason: fraud_escalation
    summary: Caller reports a SIM swap
    language: en-US
  expected_status: ok
  expected_fields:
    reason: fraud_escalation
    queue: fraud
    queue_open: true
    handoff_message: I'm very sorry to hear that you are facing challenges. I will ensure we handle your request with the utmost care. I'll connect you to a representative who can help. Please hold.
  expected_state:
    handover_complete: true
    handoff_reason: fraud_escalation
  priority: P0
